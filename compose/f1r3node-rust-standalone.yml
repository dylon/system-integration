# =================================================================
# F1R3FLY RUST NODE - STANDALONE DOCKER COMPOSE
# =================================================================
# Runs a single standalone Rust node for development and testing.
#
# Usage:
#   poetry run shardctl up f1r3node --rust --standalone
#
# Or directly:
#   docker-compose --env-file ../.env.node -f compose/f1r3node-rust-standalone.yml up -d
#
# NOTE: The Rust node has a different CLI than the Scala node.
#       Use f1r3node-standalone.yml for Scala nodes.

services:
  standalone:
    image: ${F1R3FLY_RUST_IMAGE:-f1r3flyindustries/f1r3fly-rust-node:latest}
    user: root
    restart: always
    networks:
      - f1r3fly-standalone
    container_name: ${STANDALONE_HOST:-rnode.standalone}
    command:
      [
        "run",
        "-s",
        # Command-line-only on purpose (conf/standalone-dev.conf sets
        # autopropose = false and documents that it is passed here). The
        # embers bootstrap and the co-located F1r3drive both deploy and rely
        # on the validator proposing without manual intervention.
        "--autopropose",
        "--host=${STANDALONE_HOST:-rnode.standalone}",
        "--validator-private-key=${STANDALONE_PRIVATE_KEY:-5f668a7ee96d944a4494cc947e4005e172d7ab3461ee5538f1f2a45a835e9657}",
      ]
    ports:
      # Protocol server port
      - "40400:40400"
      # External gRPC API port
      - "40401:40401"
      # Internal gRPC API port
      - "40402:40402"
      # HTTP API port
      - "40403:40403"
      # Kademlia discovery port
      - "40404:40404"
      # Admin HTTP API port
      - "40405:40405"
    volumes:
      - standalone-data:/var/lib/rnode
      # Standalone configuration file
      - ../conf/standalone-dev.conf:/var/lib/rnode/rnode.conf
      # Standalone genesis files (single validator)
      - ../genesis/standalone-wallets.txt:/var/lib/rnode/genesis/wallets.txt
      - ../genesis/standalone-bonds.txt:/var/lib/rnode/genesis/bonds.txt
    environment:
      # Compose gives the OS environment precedence over --env-file: shell-
      # exported OPENAI_* values silently override .env.node here.
      - OPENAI_ENABLED=${OPENAI_ENABLED:-false}
      # The Rust node resolves the key from OPENAI_API_KEY (or openai.api-key
      # in the conf); OPENAI_SCALA_CLIENT_API_KEY is the Scala node's variable,
      # kept for compose parity with the Scala files.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_SCALA_CLIENT_API_KEY=${OPENAI_SCALA_CLIENT_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:40403/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  standalone-data:

networks:
  f1r3fly-standalone:
    driver: bridge
